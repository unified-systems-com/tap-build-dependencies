# TAP secret-source provider: AWS Secrets Manager.
#
# NOT a grid plugin. It contributes ONLY a `tap.secret_sources` provider (Decision A,
# specs/spec-plugin-dependency-resolution.md req-plugin-depres-sources) — no `tap.plugins`
# entry point, no BaseModel, no collectors, no tap-plugin.toml. It exists so the AWS SDK
# (boto3) rides with THIS distribution and never enters TAP core; TAP resolves a secret's
# value from AWS Secrets Manager only when this distribution is installed AND allow-listed
# (tap.secret_sources trust gate). Bootstrap-tier: public and secret-free, so it installs
# before any secret-gated plugin (req-plugin-depres-bootstrap-1). When a CI lane needs to
# resolve a secret, this distribution is preinstalled into that lane's image (Decision B) —
# but there is no live CI consumer today: the plugin repos are public, so no lane resolves a
# secret, and this preinstall wiring is dormant until a secret-gated consumer returns.
[project]
name = "aws-secrets-source"
description = "TAP secret source: AWS Secrets Manager (a tap.secret_sources provider; not a grid plugin)."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = ["boto3>=1.34"]

# The one thing this distribution contributes. Discovered from distribution metadata by
# tap.secret_sources at preboot; the routing token `aws_secrets_manager` is what a secret
# manifest names in `metadata.source`.
[project.entry-points."tap.secret_sources"]
aws_secrets_manager = "aws_secrets_source.source:AwsSecretsManagerSource"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The release tag is the single version authority (org convention,
# req-cicd-release-artifacts in TAP core's spec-cicd-hardening.md). Multi-project
# repo, so tags carry the DIST NAME prefix — aws-secrets-source-vX.Y.Z — and the
# --match filter keeps this project's version from ever deriving off a sibling
# project's tag. setuptools-scm's default tag regex strips the name prefix natively.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# The git root is one level up from this project dir; explicit (not
# search_parent_directories) so a layout change fails the build loudly instead
# of deriving from whatever repo happens to enclose it.
root = ".."
fallback_version = "0.0.0"
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "aws-secrets-source-v*",
]

[tool.hatch.build.targets.wheel]
only-include = ["aws_secrets_source"]
